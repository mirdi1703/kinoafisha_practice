{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — Киноафиша</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="icon" type="image/svg+xml" href="{% static 'images/favicon.svg' %}">
</head>
<body>

    <header class="header">
        <a href="{% url 'movie_list' %}" class="logo-link">
            <div class="logo">
                <span class="logo-badge">KINO</span> Киноафиша Ульяновск
            </div>
        </a>

        <button type="button" class="burger-btn" aria-label="Открыть меню" aria-expanded="false">
        <span class="burger-line"></span>
        <span class="burger-line"></span>
        <span class="burger-line"></span>
        </button>

        <nav class="nav">
            <a href="{% url 'login' %}">Войти</a>
        </nav>
    </header>

    <main class="container">
        <div class="auth-card">
            <h1>Регистрация</h1>
            <form method="post" class="auth-form">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary btn-full">Зарегистрироваться</button>
            </form>
            <p class="caption auth-footer-text">Уже есть аккаунт? <a href="{% url 'login' %}">Войдите</a></p>
        </div>
    </main>

    <footer class="footer">
        <p>© 2026 Киноафиша Ульяновск. Все права защищены.</p>
    </footer>

    <script src="{% static 'js/burger_menu.js' %}"></script>

</body>
</html>
